name: 毎朝ダイジェスト通知

on:
  schedule:
    # 毎朝 7:00 JST (= 22:00 UTC 前日)
    - cron: '0 22 * * *'
  workflow_dispatch:  # 手動実行も可

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate digest & notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import os
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          today = datetime.now(JST).strftime('%Y/%m/%d (%a)')

          with open('data/status.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          domains = data.get('domains', [])

          status_emoji = {'green': '🟢', 'yellow': '🟡', 'red': '🔴', 'gray': '⚪'}
          status_label = {'green': '正常', 'yellow': '要確認', 'red': '要対処', 'gray': '未着手'}

          # Sort: red → yellow → green → gray
          order = {'red': 0, 'yellow': 1, 'green': 2, 'gray': 3}
          domains_sorted = sorted(domains, key=lambda d: order.get(d['status'], 9))

          urgent = [d for d in domains if d['status'] == 'red']
          attention = [d for d in domains if d['status'] == 'yellow']
          ok = [d for d in domains if d['status'] == 'green']

          # Build message
          lines = [f"*⚡ Life OS 朝のダイジェスト — {today}*"]

          if urgent:
              lines.append("\n*🔴 要対処*")
              for d in urgent:
                  note = f"  └ {d['note']}" if d.get('note') else ""
                  lines.append(f"  • {d['emoji']} {d['name']}{note}")

          if attention:
              lines.append("\n*🟡 要確認*")
              for d in attention:
                  note = f"  └ {d['note']}" if d.get('note') else ""
                  lines.append(f"  • {d['emoji']} {d['name']}{note}")

          if ok:
              lines.append("\n*🟢 進行中*")
              for d in ok:
                  lines.append(f"  • {d['emoji']} {d['name']}")

          gray_count = sum(1 for d in domains if d['status'] == 'gray')
          if gray_count:
              lines.append(f"\n⚪ 未着手: {gray_count}ドメイン")

          lines.append(f"\n_確認: GitHub Pages のダッシュボードで更新_")

          message = '\n'.join(lines)

          webhook = os.environ.get('SLACK_WEBHOOK')
          if not webhook:
              print("SLACK_WEBHOOK not set, printing message:")
              print(message)
          else:
              payload = json.dumps({'text': message}).encode('utf-8')
              req = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req) as res:
                  print(f"Slack response: {res.status}")
          EOF
